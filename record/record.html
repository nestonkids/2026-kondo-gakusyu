<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>記録 - Future Screen</title>
    <link rel="stylesheet" href="../style.css?v=20260827_4">
    <!-- KaTeX (数式表示ライブラリ) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <section id="history-screen" class="screen active">
            <div class="glass-card visible">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                    <h2 class="screen-title" style="margin-bottom: 0;">これまでの学習記録</h2>
                    <button class="select-mode-toggle-btn" id="record-select-toggle-btn" onclick="toggleRecordSelectionMode()">☑️ 選択して削除</button>
                </div>

                <!-- 選択削除用ツールバー（選択モード時のみ表示） -->
                <div id="record-selection-toolbar" class="selection-toolbar hidden">
                    <div class="selection-toolbar-left">
                        <button class="toolbar-btn secondary" onclick="toggleSelectAllRecordHistory()">🔘 全選択 / 全解除</button>
                        <span class="selection-count-badge" id="record-selection-count">0件選択中</span>
                    </div>
                    <div class="selection-toolbar-right">
                        <button class="toolbar-btn danger" id="record-batch-delete-btn" onclick="deleteSelectedRecordHistory()" disabled>🗑️ 選択した記録を削除</button>
                        <button class="toolbar-btn close" onclick="toggleRecordSelectionMode(false)">✕ 完了</button>
                    </div>
                </div>

                <div id="empty-history-message" class="empty-message">
                    <p>まだ記録がありません。復習を始めてみよう！</p>
                </div>

                <div id="history-list" class="history-list-container">
                </div>

                <button class="back-button" onclick="location.href='../index.html'">
                    <span class="icon">🏠</span> ホームへ戻る
                </button>
            </div>
        </section>
    </main>

    <!-- 🗑️ 削除データ保持記録モーダル（3日間保持） -->
    <div id="trash-modal" class="modal-overlay hidden" onclick="closeTrashModal()">
        <div class="modal-content trash-modal-content" onclick="event.stopPropagation()">
            <div class="trash-modal-header">
                <div>
                    <h3 class="trash-modal-title">🗑️ 消去データの保持記録（3日間保持）</h3>
                    <p class="trash-modal-subtitle">
                        💡 復元したい記録を<strong>【2回右クリック】</strong>すると元の学習記録に復元されます
                    </p>
                </div>
                <button class="modal-close-btn" onclick="closeTrashModal()" title="閉じる">✕</button>
            </div>
            
            <div class="trash-notice-banner">
                <span>⏳ 削除された復習データは<strong>3日間（72時間）</strong>保持され、期限が過ぎると自動消去されます。</span>
            </div>

            <div id="trash-list-container" class="trash-list-container">
                <!-- 動的に保持アイテム一覧が生成・挿入されます -->
            </div>

            <div class="trash-modal-footer">
                <span id="trash-item-count-label" style="font-size: 0.85rem; color: #64748b; font-weight: 600;">保持中: 0件</span>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="back-button" onclick="closeTrashModal()" style="margin: 0; padding: 8px 20px;">閉じる</button>
                </div>
            </div>
        </div>
    </div>

    <script src="history.js?v=20260827_12"></script>
</body>
</html>
